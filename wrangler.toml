name = "ohnd-movie-proxy"
main = "src/index.js"
compatibility_date = "2026-08-22"

# Per-IP limit on OMDb lookups (cached repeats don't count). Protects the
# OMDb daily quota from scripts that fake the Origin header.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
